server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Include default mime types and explicitly register Blazor WASM types
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream clr;
        application/octet-stream pdb;
        application/json json;
    }

    # Enable compression for web assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 1000;

    # Blazor SPA client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Static asset caching policy (1 year immutable)
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Frontend health probe endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
