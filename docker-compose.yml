services:
  # ============================================================================
  # 1. Relational Persistence: PostgreSQL 15 Alpine
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: civicconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicconnect}
      POSTGRES_USER: ${POSTGRES_USER:-civicconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - sh
      - -c
      - |
        if [ ! -f /var/lib/postgresql/server.key ] || [ ! -f /var/lib/postgresql/server.crt ]; then
          apk add --no-cache openssl >/dev/null 2>&1 || true
          openssl req -new -x509 -days 3650 -nodes \
            -out /var/lib/postgresql/server.crt \
            -keyout /var/lib/postgresql/server.key \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,DNS:db,IP:127.0.0.1"
          chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
          chmod 600 /var/lib/postgresql/server.key
          chmod 644 /var/lib/postgresql/server.crt
        fi
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/server.crt \
          -c ssl_key_file=/var/lib/postgresql/server.key
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-wal-archive:/var/lib/postgresql/wal_archive
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicconnect} -d ${POSTGRES_DB:-civicconnect}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - civicconnect-net

  # ============================================================================
  # 2. Automated Logical Backup & Retention Rotation Service (NFR-02 & NFR-05)
  # ============================================================================
  db-backup:
    image: postgres:15-alpine
    container_name: civicconnect-db-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-civicconnect}
      POSTGRES_USER: ${POSTGRES_USER:-civicconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_SCHEDULE_INTERVAL_SECONDS: ${BACKUP_SCHEDULE_INTERVAL_SECONDS:-86400}
      USE_DOCKER_EXEC: "false"
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        echo "[db-backup] Scheduled logical backup service initialized (interval=${BACKUP_SCHEDULE_INTERVAL_SECONDS:-86400}s, retention=${BACKUP_RETENTION_DAYS:-30}d)."
        while true; do
          /bin/bash /scripts/backup-db.sh --backup-dir /backups --retention-days "$${BACKUP_RETENTION_DAYS:-30}"
          sleep "$${BACKUP_SCHEDULE_INTERVAL_SECONDS:-86400}"
        done
    depends_on:
      db:
        condition: service_healthy
    networks:
      - civicconnect-net

  # ============================================================================
  # 3. Message Broker: RabbitMQ 3 Management Alpine
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: civicconnect-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-civicconnect}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - civicconnect-net

  # ============================================================================
  # 4. Core Service Layer: ASP.NET Core Web API (.NET 10)
  # ============================================================================
  backend-api:
    build:
      context: .
      dockerfile: src/CivicConnect.Api/Dockerfile
    container_name: civicconnect-backend-api
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5060}:5060"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5060
      - CONNECTION_STRING=Host=db;Port=5432;Database=${POSTGRES_DB:-civicconnect};Username=${POSTGRES_USER:-civicconnect};Password=${POSTGRES_PASSWORD:-changeme};SslMode=Require
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-civicconnect};Username=${POSTGRES_USER:-civicconnect};Password=${POSTGRES_PASSWORD:-changeme};SslMode=Require
      - JWT_SECRET=${JWT_SECRET:-}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER:-civicconnect}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5060/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - civicconnect-net

  # ============================================================================
  # 5. Presentation Layer: Blazor Web App (.NET 10 Kestrel)
  # ============================================================================
  frontend-web:
    build:
      context: .
      dockerfile: src/CivicConnect.Web/Dockerfile
    container_name: civicconnect-frontend-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8085}:8085"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8085
      - CONNECTION_STRING=Host=db;Port=5432;Database=${POSTGRES_DB:-civicconnect};Username=${POSTGRES_USER:-civicconnect};Password=${POSTGRES_PASSWORD:-changeme};SslMode=Require
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-civicconnect};Username=${POSTGRES_USER:-civicconnect};Password=${POSTGRES_PASSWORD:-changeme};SslMode=Require
      - JWT_SECRET=${JWT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      backend-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - civicconnect-net

volumes:
  db-data:
    name: civicconnect-db-data
  db-wal-archive:
    name: civicconnect-db-wal-archive
  rabbitmq-data:
    name: civicconnect-rabbitmq-data

networks:
  civicconnect-net:
    name: civicconnect-net
    driver: bridge