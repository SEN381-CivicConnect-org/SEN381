services:
  # ============================================================================
  # 1. Relational Persistence: PostgreSQL 15 Alpine
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: civicconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicconnect}
      POSTGRES_USER: ${POSTGRES_USER:-civicconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - sh
      - -c
      - |
        if [ ! -f /var/lib/postgresql/server.key ] || [ ! -f /var/lib/postgresql/server.crt ]; then
          apk add --no-cache openssl >/dev/null 2>&1 || true
          openssl req -new -x509 -days 3650 -nodes \
            -out /var/lib/postgresql/server.crt \
            -keyout /var/lib/postgresql/server.key \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,DNS:db,IP:127.0.0.1"
          chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
          chmod 600 /var/lib/postgresql/server.key
          chmod 644 /var/lib/postgresql/server.crt
        fi
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/server.crt \
          -c ssl_key_file=/var/lib/postgresql/server.key
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicconnect} -d ${POSTGRES_DB:-civicconnect}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - civicconnect-net

  # ============================================================================
  # 2. Message Broker: RabbitMQ 3 Management Alpine
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: civicconnect-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-civicconnect}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - civicconnect-net

  # ============================================================================
  # 3. Database Migration Runner: Dedicated DDL Pipeline Task (NFR-10, IT-SEC-02)
  # ============================================================================
  db-migration:
    build:
      context: .
      dockerfile: src/CivicConnect.Web/Dockerfile
    container_name: civicconnect-db-migration
    restart: "no"
    command: ["--migrate-only"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CONNECTION_STRING=Host=db;Port=5432;Database=${POSTGRES_DB:-civicconnect};Username=${CIVIC_APP_USER:-civic_app};Password=${CIVIC_APP_PASSWORD:-civic_app_secure_dev_pass};SslMode=Require
      - MIGRATION_CONNECTION_STRING=Host=db;Port=5432;Database=${POSTGRES_DB:-civicconnect};Username=${CIVIC_MIGRATE_USER:-civic_migrate};Password=${CIVIC_MIGRATE_PASSWORD:-civic_migrate_secure_pass};SslMode=Require
    depends_on:
      db:
        condition: service_healthy
    networks:
      - civicconnect-net

  # ============================================================================
  # 4. Core Service Layer: ASP.NET Core Web API (.NET 10)
  # ============================================================================
  backend-api:
    build:
      context: .
      dockerfile: src/CivicConnect.Api/Dockerfile
    container_name: civicconnect-backend-api
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5060}:5060"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5060
      - CONNECTION_STRING=Host=db;Port=5432;Database=${POSTGRES_DB:-civicconnect};Username=${CIVIC_APP_USER:-civic_app};Password=${CIVIC_APP_PASSWORD:-civic_app_secure_dev_pass};SslMode=Require
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-civicconnect};Username=${CIVIC_APP_USER:-civic_app};Password=${CIVIC_APP_PASSWORD:-civic_app_secure_dev_pass};SslMode=Require
      - JWT_SECRET=${JWT_SECRET:-}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER:-civicconnect}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
    depends_on:
      db:
        condition: service_healthy
      db-migration:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5060/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - civicconnect-net

  # ============================================================================
  # 5. Presentation Layer: Blazor Web App (.NET 10 Kestrel)
  # ============================================================================
  frontend-web:
    build:
      context: .
      dockerfile: src/CivicConnect.Web/Dockerfile
    container_name: civicconnect-frontend-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8085}:8085"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8085
      - CONNECTION_STRING=Host=db;Port=5432;Database=${POSTGRES_DB:-civicconnect};Username=${CIVIC_APP_USER:-civic_app};Password=${CIVIC_APP_PASSWORD:-civic_app_secure_dev_pass};SslMode=Require
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-civicconnect};Username=${CIVIC_APP_USER:-civic_app};Password=${CIVIC_APP_PASSWORD:-civic_app_secure_dev_pass};SslMode=Require
      - JWT_SECRET=${JWT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      db-migration:
        condition: service_completed_successfully
      backend-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - civicconnect-net

volumes:
  db-data:
    name: civicconnect-db-data
  rabbitmq-data:
    name: civicconnect-rabbitmq-data

networks:
  civicconnect-net:
    name: civicconnect-net
    driver: bridge