name: Board sync (reusable)

# All the project-board logic lives here. The thin trigger jobs in
# project-board-sync.yml call it. Every run is idempotent, so re-running is safe.

on:
  workflow_call:
    inputs:
      mode:
        description: "pr | issue-opened | reconcile"
        type: string
        required: true
      pr_number:
        type: string
        required: false
        default: ""
      issue_number:
        type: string
        required: false
        default: ""
    secrets:
      PROJECT_TOKEN:
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # pull_request_target checks out the base branch, never PR head code.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          EXCLUDED_ASSIGNEES: ${{ vars.EXCLUDED_ASSIGNEES }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const sync = require('./.github/scripts/board-sync.js');
            await sync({ github, context, core });
